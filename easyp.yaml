deps: [
  github.com/bufbuild/protoc-gen-validate,
  github.com/googleapis/googleapis,
  github.com/grpc-ecosystem/grpc-gateway,
  github.com/easyp-tech/protoc-gen-easydoc,
  github.com/easyp-tech/protoc-gen-mcp,
]

lint:
  use:
    # Minimal
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DEFINED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY

    # Basic
    - ENUM_FIRST_VALUE_ZERO
    - ENUM_NO_ALLOW_ALIAS
    - ENUM_PASCAL_CASE
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - FIELD_LOWER_SNAKE_CASE
    - IMPORT_NO_PUBLIC
    - IMPORT_NO_WEAK
    - IMPORT_USED
    - MESSAGE_PASCAL_CASE
    - ONEOF_LOWER_SNAKE_CASE
    - PACKAGE_LOWER_SNAKE_CASE
    - PACKAGE_SAME_CSHARP_NAMESPACE
    - PACKAGE_SAME_GO_PACKAGE
    - PACKAGE_SAME_JAVA_MULTIPLE_FILES
    - PACKAGE_SAME_JAVA_PACKAGE
    - PACKAGE_SAME_PHP_NAMESPACE
    - PACKAGE_SAME_RUBY_PACKAGE
    - PACKAGE_SAME_SWIFT_PREFIX
    - RPC_PASCAL_CASE
    - SERVICE_PASCAL_CASE

    # Default
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FILE_LOWER_SNAKE_CASE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX

    # Comments
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE

    # Unary RPC
    - RPC_NO_CLIENT_STREAMING
    - RPC_NO_SERVER_STREAMING

  # PACKAGE_DIRECTORY_MATCH wants package easyp.generator.v1 to sit in
  # easyp/generator/v1. It does, relative to the import root — but the import
  # root is api/, because the contract is its own Go module, and the rule sees
  # the path from the repository instead. There is no root setting for lint the
  # way there is for generate, so the rule is exempted here rather than dropped
  # from `use`, where it still guards every proto added later.
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - api

  enum_zero_value_suffix: NONE

  service_suffix: API

generate:

  inputs:
    # root is the import root, path is what to walk inside it. The proto lives
    # at api/easyp/generator/v1/ on disk but its import path is
    # easyp/generator/v1/generator.proto — which is what PACKAGE_DIRECTORY_MATCH
    # compares against package easyp.generator.v1. The api/ prefix is a Go
    # module boundary, not part of the proto namespace.
    - directory:
        path: easyp
        root: api

  plugins:
    - remote: "plugins.beta.easyp.tech/protocolbuffers/go"
      out: api
      opts:
        paths: source_relative
    - remote: "plugins.beta.easyp.tech/grpc/go"
      out: api
      opts:
        paths: source_relative
        require_unimplemented_servers: false
    # The version here has to match the mcpruntime version in go.mod: the
    # generated .mcp.go calls into that library, so generating with one
    # version and linking another is how the two stop agreeing.
    #
    # KNOWN ISSUE: easyp's command executor currently feeds this plugin a
    # request it answers with an empty response, so generate leaves .mcp.go
    # stale without any error. Until that is fixed, regenerate it with:
    #   go run -tags mcpgen ./test/mcpgen
    - command: ["go", "run", "github.com/easyp-tech/protoc-gen-mcp/cmd/protoc-gen-mcp@v0.5.0"]
      out: api
      opts:
        paths: source_relative
    # - remote: "api.beta.easyp.tech/easyp-tech/easydoc"
    #   out: docs
    #   opts:
    #     formats: "html|md"
