version: "3"

tasks:
  build-plugins:
    desc: "Build all plugin binaries from registry/ Dockerfiles"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --parallel 12 --output plugins "

  build-plugins-filter:
    desc: "Build a subset of plugins, e.g. FILTER='protocolbuffers/*' task build-plugins-filter"
    dir: "{{.USER_WORKING_DIR}}"
    cmds:
      - "go run ./cmd/easyp-svc/ plugins build registry --output plugins --filter '{{.FILTER}}'"

  publish-archives:
    desc: >-
      Publish an archive tree (from `plugins build --archive`) to any service and S3-compatible storage, e.g.
      S3_ENDPOINT=https://storage.example.com ADDR=plugins.example.com:443 EASYP_TOKEN=...
      AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... task publish-archives
    dir: "{{.USER_WORKING_DIR}}"
    vars:
      ARCHIVES: '{{.ARCHIVES | default "../plugin-archives"}}'
      S3_BUCKET: '{{.S3_BUCKET | default "easyp-plugins"}}'
      # Storage tends to cap one connection well below the uplink, so the
      # default here is high enough to saturate an ordinary link.
      PARALLEL: '{{.PARALLEL | default "24"}}'
    preconditions:
      - sh: 'test -n "$S3_ENDPOINT"'
        msg: "S3_ENDPOINT is required, e.g. S3_ENDPOINT=https://storage.example.com task publish-archives"
      - sh: 'test -n "$ADDR"'
        msg: "ADDR is required: the service the archives are registered with, e.g. ADDR=plugins.example.com:443"
      - sh: 'test -d "{{.ARCHIVES}}"'
        msg: "{{.ARCHIVES}} not found; build with `plugins build --archive` first or pass ARCHIVES=<dir>"
    cmds:
      # Credentials are left to the AWS SDK default chain and EASYP_TOKEN: they
      # belong in the environment or a secret manager, never in this file.
      - >-
        go run ./cmd/easyp-svc/ plugins publish --archives {{.ARCHIVES}}
        --endpoint "$S3_ENDPOINT"
        --bucket {{.S3_BUCKET}}
        --force-path-style
        --parallel {{.PARALLEL}}
        --addr "$ADDR"

  generate:
    desc: "Regenerate api/ with easyp, against the plugins easyp.yaml names"
    dir: "{{.USER_WORKING_DIR}}"
    preconditions:
      - "test -f easyp.yaml"
    cmds:
      - "easyp --cfg easyp.yaml generate"
