# easyp generate against the community tier of the dev stack.
#
# Inputs, deps and lint rules are those of easyp.yaml — only the plugin host
# differs, so a run here and a run there compare directly. This tier carries no
# licence on purpose: it stops at 10 registered plugins and 4 workers, which is
# what makes a refusal here a finding rather than a puzzle.
#
# Against a two-tier stack on this machine, use localhost:8080 instead of the
# host below; the deployed dev stack answers on the name as written.

deps:
  [
    github.com/bufbuild/protoc-gen-validate,
    github.com/googleapis/googleapis,
    github.com/grpc-ecosystem/grpc-gateway,
    github.com/easyp-tech/protoc-gen-easydoc,
    github.com/easyp-tech/protoc-gen-mcp,
  ]

lint:
  use:
    # Minimal
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DEFINED
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY

    # Basic
    - ENUM_FIRST_VALUE_ZERO
    - ENUM_NO_ALLOW_ALIAS
    - ENUM_PASCAL_CASE
    - ENUM_VALUE_UPPER_SNAKE_CASE
    - FIELD_LOWER_SNAKE_CASE
    - IMPORT_NO_PUBLIC
    - IMPORT_NO_WEAK
    - IMPORT_USED
    - MESSAGE_PASCAL_CASE
    - ONEOF_LOWER_SNAKE_CASE
    - PACKAGE_LOWER_SNAKE_CASE
    - PACKAGE_SAME_CSHARP_NAMESPACE
    - PACKAGE_SAME_GO_PACKAGE
    - PACKAGE_SAME_JAVA_MULTIPLE_FILES
    - PACKAGE_SAME_JAVA_PACKAGE
    - PACKAGE_SAME_PHP_NAMESPACE
    - PACKAGE_SAME_RUBY_PACKAGE
    - PACKAGE_SAME_SWIFT_PREFIX
    - RPC_PASCAL_CASE
    - SERVICE_PASCAL_CASE

    # Default
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - FILE_LOWER_SNAKE_CASE
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX

    # Comments
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_MESSAGE
    - COMMENT_ONEOF
    - COMMENT_RPC
    - COMMENT_SERVICE

    # Unary RPC
    - RPC_NO_CLIENT_STREAMING
    - RPC_NO_SERVER_STREAMING

  enum_zero_value_suffix: NONE

  service_suffix: API

generate:
  inputs:
    - directory:
        path: api
        root: "."

  plugins:
    - remote: "community.plugins.beta.easyp.tech/protocolbuffers/go"
      out: .
      opts:
        paths: source_relative
    - remote: "community.plugins.beta.easyp.tech/grpc/go"
      out: .
      opts:
        paths: source_relative
        require_unimplemented_servers: false
    - command:
        [
          "go",
          "run",
          "github.com/easyp-tech/protoc-gen-mcp/cmd/protoc-gen-mcp@v0.3.1",
        ]
      out: .
      opts:
        paths: source_relative
