# Configuration for the main compose stack (deploy/docker-compose.yml).
#
# This file states what differs from the defaults compiled into the binary, and
# nothing else. It used to restate almost all of them, which is how
# worker_pool.max_retries came to say 3 here and 2 in the Helm chart without
# anyone deciding it: a line that repeats a default is indistinguishable from a
# line that overrides one, so nobody could see which of these mattered.
#
# The defaults are documented where they are defined, in internal/config, and
# the resolved configuration — defaults, this file and the environment together,
# with the origin of every value — is one command away:
#
#   easyp-svc config print --cfg deploy/config/config.yml --origin
#
# Every setting here can be overridden by its environment variable; see
# deploy/.env.example for the names.

server:
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  # CIDRs whose X-Forwarded-For and X-Real-IP headers may be believed. This is
  # the easyp_network subnet, pinned in docker-compose.yml — the gRPC port is not
  # published, so traefik is the only thing that reaches the listener and its
  # address is the one every request arrives from.
  #
  # Empty would be wrong here, not merely unset: with no trusted range the
  # library short-circuits to the connecting address and never reads a header at
  # all, so the rate limit and the per-caller concurrency limit apply to everyone
  # combined and the audit log names traefik rather than who acted.
  trusted_proxies: ["172.28.0.0/16"]
  # client_ca_file turns the listener into mutual TLS: only certificates signed
  # by that CA are accepted, which is how traefik is authenticated here. Without
  # a cert_file the service serves plaintext and warns on every start.
  tls:
    cert_file: "/certs/server.crt"
    key_file: "/certs/server.key"
    client_ca_file: "/certs/ca.crt"

db:
  postgres: "postgres://easyp_svc:easyp_pass@easyp-postgres:5432/easyp_db?sslmode=disable"

registry:
  s3:
    # The rustfs container of this stack. Credentials are its built-in demo pair
    # and are committed on purpose: they unlock nothing outside the compose
    # network. Anything reachable from elsewhere takes its keys from
    # REGISTRY_S3_ACCESS_KEY_ID and REGISTRY_S3_SECRET_ACCESS_KEY instead.
    endpoint: "http://rustfs:9000"
    bucket: "easyp-plugins"
    access_key_id: "rustfsadmin"
    secret_access_key: "rustfsadmin"
    force_path_style: true

# Named here because this stack does bring up a collector, unlike the dev one.
# These have no defaults, so leaving them out is how a deployment says it has
# none — a fallback would name a container that is not there and the exporters
# would retry it forever.
telemetry:
  otlp_endpoint: "easyp-alloy:4317"
  pyroscope_endpoint: "http://easyp-pyroscope:4040"

# license is absent, so the service runs in community mode: no audit, at most 4
# workers and 10 registered plugins. Enterprise needs both a token and a key to
# verify it against, and both arrive from the environment — LICENSE_KEY and
# LICENSE_PUBLIC_KEYS — because the token is a credential. Writing the public key
# into a config file also makes the trust anchor editable: whoever can change the
# file decides which authority may issue licences.

# Credentials for the mutating methods (CreatePlugin/UpdatePlugin/DeletePlugin).
# Reads stay anonymous. Only sha256 digests live here, never the tokens, so this
# section is safe to commit; the token itself belongs in your secret manager.
# Generate a pair with: easyp-svc auth new-token --name ci
# An empty list denies every write — a forgotten config must break registration
# rather than leave the registry open to the internet.
#
# The entry below is the digest of the literal string "local-dev-token" so the
# compose stack works out of the box. It is published in this repository and
# therefore worthless as a secret: REPLACE IT before this config goes anywhere
# a stranger can reach. The dev stack's configs ship no token at all for exactly
# that reason — see config.community.dev.yml.
# The MCP endpoint is opt-in (off by default): these are easyp-tech's own
# deployments, where it sits behind the stack's edge and is meant to be open.
mcp:
  enabled: true

auth:
  write_tokens:
    - name: "local-dev"
      sha256: "0cd48eed49739dfdd99efaef37d251aae5a80866e5954763c6597943fff5ce9b"

rate_limit:
  # Room for `plugins register --parallel`, whose default is 8. The binary's
  # default per-address cap is 2, and behind traefik every registration
  # arrives from one address; past the cap the server answers
  # ResourceExhausted, which the SDK does not retry.
  max_concurrent_per_ip: 10
