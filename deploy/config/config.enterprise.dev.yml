# Enterprise tier of the two-tier dev stack (deploy/docker-compose.dev.yml).
#
# This file states what differs from the defaults compiled into the binary, and
# nothing else — see the header of config.community.dev.yml for why.
#
# To see the whole resolved configuration, defaults included:
#   easyp-svc config print --cfg deploy/config/config.enterprise.dev.yml --origin
#
# What makes this container the enterprise one is not in this file: it is
# LICENSE_KEY, passed in from deploy/.env.dev. An unverifiable licence is not a
# startup failure — the container runs as community and logs it — so `task
# tier-dev` exists to assert the difference rather than assume it.

server:
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  # Traefik's address, fixed in docker-compose.dev.yml. Callers arriving through
  # it all share that address, so without this the rate limit and the per-caller
  # concurrency limit apply to everyone combined and the audit log names the
  # proxy.
  #
  # It used to be the whole 172.28.0.0/16 subnet, which trusted every container
  # on the network to say truthfully who its caller was — one X-Forwarded-For
  # header and you pick whose rate-limit bucket to spend and whose name goes in
  # the audit log. Leave it empty only for a listener clients reach directly.
  trusted_proxies: ["172.28.0.10/32"]
  tls:
    cert_file: "/certs/server.crt"
    key_file: "/certs/server.key"
    client_ca_file: "/certs/ca.crt"

db:
  postgres: "postgres://easyp_svc:easyp_pass@postgres:5432/easyp_enterprise_db?sslmode=disable"

registry:
  # Written down although the file is otherwise only differences from the
  # defaults, because this is a difference — the default is 20 GiB and this host
  # has a 14 GB disk. Left implicit it was worse than wrong: eviction could
  # never start, so the disk would fill instead, taking postgres on the same
  # volume with it, and the alert meant to warn was set at 95% of a size the
  # filesystem cannot hold. Two tiers share this disk, so 2 GiB each.
  cache_max_bytes: 2147483648
  s3:
    endpoint: "https://storage.h3llo.cloud"
    bucket: "easyp-plugins"
    force_path_style: true
    # access_key_id and secret_access_key are deliberately absent. They arrive as
    # REGISTRY_S3_ACCESS_KEY_ID and REGISTRY_S3_SECRET_ACCESS_KEY from
    # deploy/.env.dev, which is not committed. This file is, and a previous
    # version of it put a live key pair in a public repository.

# Four times the community capacity. The licence does not grant this — it lifts
# the ceiling (core.EnterpriseLicenseClaims reports no worker limit) and the
# numbers below are what the deployment then chooses to use.
worker_pool:
  workers: 16
  queue_size: 64
  max_concurrent_generations: 64

rate_limit:
  requests_per_second: 50.0
  burst: 100
  # Also the ceiling for `plugins register --parallel`: past this the server
  # refuses with ResourceExhausted, which the SDK does not retry — overload is
  # a refusal the service means — so register reports each one as an error.
  max_concurrent_per_ip: 10

# See config.community.dev.yml for why this is written down empty rather than
# left out. Real digests arrive through AUTH_WRITE_TOKENS in deploy/.env.dev.
# The MCP endpoint is opt-in (off by default): these are easyp-tech's own
# deployments, where it sits behind the stack's edge and is meant to be open.
mcp:
  enabled: true

auth:
  write_tokens: []
