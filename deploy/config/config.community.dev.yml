# Community tier of the two-tier dev stack (deploy/docker-compose.dev.yml).
#
# This file states what differs from the defaults compiled into the binary, and
# nothing else. It used to restate all of them — 103 lines, of which about ten
# said anything — and that is how worker_pool.max_retries came to disagree with
# the Helm chart for months without anyone choosing it: a line that repeats a
# default looks identical to a line that overrides one.
#
# To see the whole resolved configuration, defaults included:
#   easyp-svc config print --cfg deploy/config/config.community.dev.yml --origin
#
# The difference from config.enterprise.dev.yml is now the whole of the
# difference between the tiers: a database, and the capacity limits below.
# Note that the tier itself is not set here — it comes from the licence, or from
# the absence of one, which is what makes this the community container.

server:
  port:
    grpc: 8080
    metric: 8081
    health: 8082
    mcp: 8083
  # Traefik's address, fixed in docker-compose.dev.yml — see the same key in
  # config.enterprise.dev.yml for why this is one address and not the subnet it
  # used to be. Leave it empty only for a listener clients reach directly.
  trusted_proxies: ["172.28.0.10/32"]
  tls:
    cert_file: "/certs/server.crt"
    key_file: "/certs/server.key"
    client_ca_file: "/certs/ca.crt"

db:
  postgres: "postgres://easyp_svc:easyp_pass@postgres:5432/easyp_community_db?sslmode=disable"

registry:
  # See the same key in config.enterprise.dev.yml: the 20 GiB default does not
  # fit a 14 GB disk shared by two tiers, and left at the default the cache
  # never evicts — the disk fills first.
  cache_max_bytes: 2147483648
  s3:
    endpoint: "https://storage.h3llo.cloud"
    bucket: "easyp-plugins"
    force_path_style: true
    # access_key_id and secret_access_key are deliberately absent. They arrive as
    # REGISTRY_S3_ACCESS_KEY_ID and REGISTRY_S3_SECRET_ACCESS_KEY from
    # deploy/.env.dev, which is not committed. This file is, and a previous
    # version of it put a live key pair in a public repository.

# telemetry is deliberately not set: docker-compose.dev.yml brings up no
# collector, and the endpoints have no defaults precisely so that "none" can be
# expressed. An endpoint naming a container that is not there does not fail
# loudly — the exporters are built lazily and then retry an unresolvable name
# forever, filling the log with connection errors while the service works.
#
# With docker-compose.observability.yml layered on, set them in deploy/.env.dev
# rather than here:
#   TELEMETRY_OTLP_ENDPOINT=easyp-alloy:4317
#   TELEMETRY_PYROSCOPE_ENDPOINT=http://easyp-pyroscope:4040
# The environment overrides this file on every startup path, so one stack can
# have telemetry and another none without either editing a committed config.

# worker_pool and rate_limit are absent here and present in the enterprise
# config: the community tier runs on the defaults, and the enterprise one is
# what raises them. Seeing which is which was the point of removing the repeats.

# Credentials for the mutating methods (CreatePlugin/UpdatePlugin/DeletePlugin).
# Reads stay anonymous.
#
# Deliberately empty rather than absent, which resolves to the same thing: this
# is the stack docker-compose.public.yml puts on the internet with a real
# certificate, and what used to sit here was the digest of the literal
# "local-dev-token" — published in this repository, so anyone who read it could
# create, replace and delete plugins here. Written down so that the decision is
# visible in the file and survives someone tidying it.
#
# Supply real ones through AUTH_WRITE_TOKENS in deploy/.env.dev, which is not
# committed: "ci=<64 hex>,me=<64 hex>". Generate a pair with
#   easyp-svc auth new-token --name ci
# Only digests travel; the token itself belongs in your secret manager.
# The MCP endpoint is opt-in (off by default): these are easyp-tech's own
# deployments, where it sits behind the stack's edge and is meant to be open.
mcp:
  enabled: true

auth:
  write_tokens: []

rate_limit:
  # The same room for `plugins register --parallel` as the enterprise tier,
  # so the two containers differ only in what the licence changes. The
  # binary's default of 2 refuses a default register run with
  # ResourceExhausted, which the SDK does not retry.
  max_concurrent_per_ip: 10
