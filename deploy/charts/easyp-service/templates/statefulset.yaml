{{- include "easyp-service.validate" . }}
{{/*
A StatefulSet for its volumeClaimTemplates rather than for identity: the pods
are interchangeable and nothing addresses one by name. A claim template is the
one way to give each replica a ReadWriteOnce volume of its own that outlives the
pod, which is what lets the service scale out on plain block storage. Replicas
never share one volume — see the accessMode check in _helpers.tpl.

Upgrades roll. A StatefulSet deletes a pod before starting its replacement, so a
ReadWriteOnce claim is released before the next pod asks for it; the Deployment
this replaced needed Recreate for that, or waited on a Multi-Attach error
forever.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "easyp-service.fullname" . }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
  {{- if and .Values.reloader.enabled .Values.tls.enabled }}
  annotations:
    # The service loads its key pair once at startup, so a rotated certificate
    # needs a new pod. Without Reloader installed this annotation is inert and
    # rotation becomes `kubectl rollout restart`.
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  {{- if ne (include "easyp-service.autoscalingEnabled" .) "true" }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "easyp-service.fullname" . }}-headless
  # Replicas share nothing but the database, and migrations are serialised by
  # an advisory lock, so there is no reason to start them one at a time. Ordered
  # startup would make a scale-out from 2 to 8 take six startup probes in a row.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  {{- if .Values.persistence.enabled }}
  {{- with .Values.persistence.retentionPolicy }}
  # Honoured from Kubernetes 1.27; older API servers drop the field, which
  # leaves the claims in place — the same as Retain. Absent altogether (a
  # --reuse-values upgrade from 1.0.4), the field is left out, and Kubernetes
  # defaults both to Retain as well.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .whenDeleted | default "Retain" }}
    whenScaled: {{ .whenScaled | default "Retain" }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "easyp-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "easyp-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # The configuration is read once at startup, so a changed ConfigMap does
        # nothing until the pods are replaced. Kubernetes does not roll a
        # StatefulSet when a mounted ConfigMap changes; hashing it into the pod
        # template is what turns `helm upgrade --set config.…` into a rollout
        # rather than a silent no-op.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        # Same reasoning for the chart-managed secret: a rotated write token or
        # DSN otherwise waits for a restart nobody knows is needed. An
        # existingSecret cannot be hashed from here — rotating one takes
        # Reloader or `kubectl rollout restart`.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "easyp-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # Matches the user baked into the image; the plugin cache volume is
        # chowned to it via fsGroup.
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - service
            - start
            # The same file every other deployment of this service uses. What
            # used to be here instead was forty environment variables written out
            # by hand in this template — see configmap.yaml.
            - --cfg=/etc/easyp/config.yml
          securityContext:
            allowPrivilegeEscalation: false
            # Not read-only: the service unpacks plugin archives into
            # registry.pluginsDir at runtime. That path is a separate volume.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: metrics
              containerPort: {{ .Values.ports.metric }}
            - name: health
              containerPort: {{ .Values.ports.health }}
            {{- if .Values.mcp.enabled }}
            - name: mcp
              containerPort: {{ .Values.ports.mcp }}
            {{- end }}
          env:
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            # The secret's keys are the variable names; see the `secrets`
            # section of values.yaml for the exact set.
            - secretRef:
                name: {{ include "easyp-service.secretName" . }}
          # "/" checks the database, so it is readiness only. "/live" checks
          # nothing on purpose: pointing liveness at the database turns a brief
          # outage into a cluster-wide restart storm.
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/easyp
              readOnly: true
            - name: plugins
              mountPath: {{ .Values.config.registry.pluginsDir }}
            {{- if .Values.tls.enabled }}
            - name: server-tls
              mountPath: {{ .Values.tls.mountPath }}/server
              readOnly: true
            {{- if eq (include "easyp-service.mutualTLS" .) "true" }}
            - name: client-ca
              mountPath: {{ .Values.tls.mountPath }}/ca
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "easyp-service.fullname" . }}-config
        {{- /* With persistence on, volumeClaimTemplates below supply it. */}}
        {{- if not .Values.persistence.enabled }}
        - name: plugins
          # Ephemeral: every restart re-downloads plugin archives from S3.
          # sizeLimit is what keeps an overrun local to this pod — without it the
          # cache grows into the node's ephemeral storage, and the kubelet
          # resolves disk pressure by evicting pods that need not be this one.
          emptyDir:
            sizeLimit: {{ .Values.persistence.ephemeralSizeLimit }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: server-tls
          secret:
            secretName: {{ include "easyp-service.serverTLSSecret" . }}
        {{- if eq (include "easyp-service.mutualTLS" .) "true" }}
        - name: client-ca
          secret:
            secretName: {{ include "easyp-service.clientCASecret" . }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  # A claim per pod, plugins-<fullname>-N. Each starts empty and fills from
  # object storage, which is why more than one replica needs S3. Not Helm-owned:
  # `helm uninstall` leaves them, and retentionPolicy decides on scale-down.
  #
  # Immutable once created: a StatefulSet refuses any change here, so raising
  # persistence.size fails `helm upgrade`. The README's "Resizing the plugin
  # volumes" section has the procedure.
  volumeClaimTemplates:
    - metadata:
        name: plugins
        labels:
          {{- include "easyp-service.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
  {{- end }}
