{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "easyp-service.fullname" . }}
  labels:
    {{- include "easyp-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "easyp-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # With networkPolicy.ingressNamespaceSelector set, gRPC is reachable only
    # from that namespace. Left empty — the default — the `from:` list renders
    # empty, which NetworkPolicy reads as "from anywhere in the cluster": the
    # mutual-TLS leg is then the only thing gating the listener. Set the
    # selector once you know which namespace your ingress controller runs in.
    - from:
        {{- if .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
        {{- end }}
      ports:
        - port: grpc
          protocol: TCP
    # Metrics and health are scraped and probed from anywhere in the cluster;
    # neither exposes data worth restricting, and kubelet probes come from the
    # node, which a namespace selector would not match.
    - ports:
        - port: metrics
          protocol: TCP
        - port: health
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- $ports := list }}
        {{- range .Values.networkPolicy.egressPorts }}
        {{- $ports = append $ports (int .) }}
        {{- end }}
        {{- /*
        The object storage port comes from the endpoint the chart already
        knows. Listing it by hand was the one step people missed: a MinIO or
        RustFS endpoint on :9000 was dropped by this policy, and every upload
        check and download hung until it timed out, which reads as a slow
        store rather than a blocked one.
        */}}
        {{- with .Values.config.registry.s3.endpoint }}
        {{- $u := urlParse . }}
        {{- $port := ternary 80 443 (eq $u.scheme "http") }}
        {{- if contains ":" $u.host }}
        {{- $port = int (last (splitList ":" $u.host)) }}
        {{- end }}
        {{- if not (has $port $ports) }}
        {{- $ports = append $ports $port }}
        {{- end }}
        {{- end }}
        {{- range $ports }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
