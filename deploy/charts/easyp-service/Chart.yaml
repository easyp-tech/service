apiVersion: v2
name: easyp-service
description: EasyP Service — a gRPC code generation service for Protobuf schemas
type: application

# version is the chart version and moves independently of the service.
#
# 0.2.0 moves the non-secret configuration out of hand-written environment
# variables in the Deployment and into a ConfigMap the service reads with --cfg,
# which is how every other deployment of it is configured. No values changed, so
# an upgrade that touches nothing else is behaviour-preserving — but anything
# that patched the Deployment's env block directly, or supplied a setting the
# chart had no `config.*` key for, has to move: use `config.*`, or `extraEnv`
# for a setting the chart does not model.
#
# 0.3.1 hashes the chart-managed secret into the pod template, the way the
# ConfigMap already was. Found on the chart's first real install (kind): an
# upgrade that only rotated AUTH_WRITE_TOKENS kept the old pod, and the new
# token was rejected until a manual restart. Upgrading to this version rolls
# the pod once even with unchanged values — the annotation is new.
#
# 0.3.1 also makes the MCP endpoint opt-in (`mcp.enabled`, off by default),
# matching the service's own v0.13.0 default. Deployments that used :8083
# must now say so.
#
# 0.4.1 repoints runbookBaseUrl at the published runbooks page; the file it used
# to name left the repository. 0.3.2 repointed it at docs/RUNBOOKS.md when the
# runbooks moved there. 0.3.1 shipped with the
# .spec/ path in it and that directory was deleted right after the release, so
# every alert it renders links to a 404 — the page someone opens at 3am. The
# published 0.3.1 cannot be corrected in place; this is the version to upgrade
# to. Charts are immutable once pushed: any change under deploy/charts/ needs a
# version bump, or the fix reaches nobody and the next release silently
# overwrites a version customers already have.
# 0.4.0 makes the documented production path installable. The guard demanding
# ingress.serversTransport.clientSecret fired before the one that knew
# cert-manager was about to create it, so `helm install` with certManager and
# ingress enabled failed asking for a Secret the chart itself provides — the
# path values.yaml describes could not be taken at all. The replacement also
# tests certManager.enabled, not just clientCertificate.enabled: the latter
# defaults to true while certificates.yaml is gated on the former, so the
# default combination would otherwise pass validation and point a
# ServersTransport at a Secret nobody creates.
#
# values.yaml also now names three mandatory inputs rather than two. tls.enabled
# defaults to true, so TLS material is a decision every installer makes, and an
# install carrying only a DSN is refused — which the header did not say.
#
# And EasypGenerationErrorRate can fire. Its two counters carry different label
# sets, so the unaggregated division matched no series: valid PromQL, valid
# YAML, an alert incapable of producing anything. tests/render.sh now runs
# `promtool test rules` against real series rather than only `check rules`,
# which reads expressions without knowing whether one can ever fire.
version: 1.0.1
# appVersion tracks the service release this chart was validated against and is
# the default image tag — so it has to be a tag that exists. It was "0.9.0",
# and the registry publishes "v0.9.0": a default install pulled a tag that has
# never existed and stopped at ImagePullBackOff; `helm template` renders a
# wrong tag as happily as a right one. v1.0.1 is the release this chart ships
# with — do not publish the chart before that tag exists.
appVersion: "v1.0.1"

home: https://github.com/easyp-tech/service
sources:
  - https://github.com/easyp-tech/service

keywords:
  - protobuf
  - grpc
  - codegen

maintainers:
  - name: easyp-tech
    url: https://github.com/easyp-tech

annotations:
  # The service itself is Elastic License 2.0; only sdk/ is Apache 2.0.
  licenses: Elastic-2.0
