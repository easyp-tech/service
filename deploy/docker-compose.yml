# Pinned rather than inferred. Compose names the project after the directory
# holding this file, which is now deploy/ — so without this the volumes would
# have been renamed by the move, silently orphaning the existing dev database.
name: easyp

networks:
  easyp_network:
    name: easyp_network
    driver: bridge
    # Pinned for the same reason as the project name above: server.trusted_proxies
    # in config/config.yml names this range, and a subnet Docker picks from its
    # pool would change under the config the first time the network was recreated.
    # The service would then stop believing traefik's forwarding headers and go
    # back to rate-limiting every caller as one — silently.
    #
    # ip_range matches docker-compose.dev.yml: dynamic addresses come from
    # 172.28.1.0/24 so that 172.28.0.0/24 stays available for the fixed ones a
    # container asks for by name. The two files share a network, so they have to
    # agree on its shape.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24

volumes:
  postgres-data:
  rustfs-data:
  grafana-data:

services:

  traefik:
    image: traefik:v3.6
    container_name: easyp-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - "./observability/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./observability/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      # Edge certificate plus the client key pair traefik presents to the
      # service, named file by file — see docker-compose.dev.yml for why the
      # directory is not mounted whole. Run `task certs` before the first
      # `docker compose up`.
      - "./certs/ca.crt:/certs/ca.crt:ro"
      - "./certs/client.crt:/certs/client.crt:ro"
      - "./certs/client.key:/certs/client.key:ro"
      - "./certs/edge.crt:/certs/edge.crt:ro"
      - "./certs/edge.key:/certs/edge.key:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # Loopback by default, like every other port in this file. It was not: this
    # stack published postgres with a committed password, rustfs with
    # rustfsadmin/rustfsadmin, the Alloy admin port and Grafana on all
    # interfaces, while DEPLOYMENT.md stated that only traefik listens outside.
    # That was true of docker-compose.dev.yml, where EASYP_BIND appears ten
    # times, and false here, where it appeared none. Run it on a machine with a
    # public address and one `docker compose up` hands out the database.
    #
    # Unlike the dev stack, traefik gets the same treatment: this one is a
    # laptop stack with no public role, so there is nothing here that should
    # answer a stranger.
    ports:
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_TRAEFIK_PORT:-4043}:80"
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_TRAEFIK_TLS_PORT:-4443}:443"
    networks:
      - easyp_network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: easyp-rustfs
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    volumes:
      - rustfs-data:/data
    ports:
      - "${EASYP_BIND:-127.0.0.1}:9000:9000"
      # The console. Nothing on the host needs it — traefik reaches it on the
      # network — so it moves aside when something else already holds 9001.
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_RUSTFS_CONSOLE_PORT:-9001}:9001"
    labels:
      traefik.enable: "true"
      traefik.http.routers.rustfs.rule: "Host(`easyp.s3.localhost`)"
      traefik.http.services.rustfs.loadbalancer.server.port: "9001"
    networks:
      - easyp_network

  init-buckets:
    image: quay.io/minio/mc:latest
    container_name: easyp-init-buckets
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin; do echo '...waiting for S3...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing rustfs/tempo;
      /usr/bin/mc mb --ignore-existing rustfs/mimir-blocks;
      /usr/bin/mc mb --ignore-existing rustfs/mimir-ruler;
      /usr/bin/mc mb --ignore-existing rustfs/mimir-alertmanager;
      /usr/bin/mc mb --ignore-existing rustfs/loki-chunks;
      /usr/bin/mc mb --ignore-existing rustfs/loki-ruler;
      /usr/bin/mc mb --ignore-existing rustfs/pyroscope;
      /usr/bin/mc mb --ignore-existing rustfs/easyp-plugins;
      exit 0;
      "
    networks:
      - easyp_network

  mimir:
    image: grafana/mimir:2.16.0
    container_name: easyp-mimir
    restart: unless-stopped
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    volumes:
      - "./observability/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro"
      # mimir.yaml names both of these, so they have to travel with it. Mimir
      # does not complain when they are missing — it starts, logs nothing, and
      # has no alerting rules at all, which is indistinguishable from a stack
      # where nothing is wrong. tests/render.sh now checks that every path the
      # config refers to is mounted in every compose file that mounts the config.
      - "./observability/mimir/rules:/etc/mimir/rules:ro"
      - "./observability/mimir/alertmanager-fallback.yaml:/etc/mimir/alertmanager-fallback.yaml:ro"
    # expand-env lets the storage settings come from the environment, so one
    # config file serves both this stack and a deployment pointing at a real
    # object store. Without the flag the ${...} placeholders are read literally.
    command: ["-config.file=/etc/mimir/mimir.yaml", "-config.expand-env=true"]
    networks:
      - easyp_network

  loki:
    image: grafana/loki:3.5.0
    container_name: easyp-loki
    restart: unless-stopped
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    volumes:
      - "./observability/loki/loki.yml:/etc/loki/loki.yml:ro"
    # expand-env lets the storage settings come from the environment, so one
    # config file serves both this stack and a deployment pointing at a real
    # object store. Without the flag the ${...} placeholders are read literally.
    command: ["-config.file=/etc/loki/loki.yml", "-config.expand-env=true"]
    networks:
      - easyp_network

  tempo:
    image: grafana/tempo:2.7.2
    container_name: easyp-tempo
    restart: unless-stopped
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    volumes:
      - "./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro"
    # expand-env lets the storage settings come from the environment, so one
    # config file serves both this stack and a deployment pointing at a real
    # object store. Without the flag the ${...} placeholders are read literally.
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    networks:
      - easyp_network

  alloy:
    image: grafana/alloy:v1.9.1
    container_name: easyp-alloy
    restart: unless-stopped
    depends_on:
      - loki
      - mimir
      - tempo
    volumes:
      - "./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      # For prometheus.exporter.unix — see the same block in
      # docker-compose.observability.yml for what the root mount costs and why
      # the disk metrics need it.
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/host/root:ro"
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    ports:
      - "${EASYP_BIND:-127.0.0.1}:12345:12345"
    networks:
      - easyp_network

  pyroscope:
    image: grafana/pyroscope:1.13.5
    container_name: easyp-pyroscope
    restart: unless-stopped
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    volumes:
      - "./observability/pyroscope/pyroscope.yaml:/etc/pyroscope/pyroscope.yaml:ro"
    # expand-env lets the storage settings come from the environment, so one
    # config file serves both this stack and a deployment pointing at a real
    # object store. Without the flag the ${...} placeholders are read literally.
    command: ["-config.file=/etc/pyroscope/pyroscope.yaml", "-config.expand-env=true"]
    networks:
      - easyp_network

  grafana:
    image: grafana/grafana:12.3.0
    container_name: easyp-grafana
    restart: unless-stopped
    depends_on:
      - loki
      - mimir
      - tempo
      - pyroscope
    volumes:
      - "./observability/grafana/config.ini:/etc/grafana/grafana.ini:ro"
      - "./observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - grafana-data:/var/lib/grafana
    environment:
      GF_PATHS_CONFIG: "/etc/grafana/grafana.ini"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
      # No GF_SECURITY_ADMIN_PASSWORD, unlike the observability overlay, which
      # demands one through `${VAR:?}`. The difference is who can reach it:
      # that stack puts Grafana on the internet, this one binds every port to
      # loopback. admin/admin on a port only this machine can open is a
      # convenience, not an exposure — but it is one only while the binding
      # above holds, which is why the two facts are written next to each other.
    ports:
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_GRAFANA_PORT:-3000}:3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`easyp.grafana.localhost`)"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    networks:
      - easyp_network

  postgres:
    image: postgres:17.7
    container_name: easyp-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: easyp_db
      POSTGRES_USER: easyp_svc
      POSTGRES_PASSWORD: easyp_pass
    ports:
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyp_svc -d easyp_db"]
      interval: 2s
      timeout: 3s
      retries: 10
      # An empty volume means initdb, and the entrypoint then restarts the server
      # it used for that, so health flaps for longer than ten two-second tries.
      # Without this the first `up` on a clean machine fails every dependent with
      # "dependency failed to start".
      start_period: 120s
    networks:
      - easyp_network

  service:
    build:
      # The repository root, not this directory: the Dockerfile compiles from
      # source and needs the module, and it stays at the root because
      # .goreleaser.yaml builds the release image from there too.
      context: ..
      dockerfile: Dockerfile
    container_name: easyp-api-service
    restart: always
    # The image runs as 65532, but ../plugins below is a bind mount whose owner
    # comes from the host. On Linux that makes the mount unwritable unless the
    # container UID matches: set EASYP_UID=$(id -u) EASYP_GID=$(id -g), or chown
    # the directory to 65532. Docker Desktop remaps ownership, so the default
    # works there as-is.
    user: "${EASYP_UID:-65532}:${EASYP_GID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
      init-buckets:
        condition: service_completed_successfully
    command: ["service", "start", "--cfg=/config.yml"]
    healthcheck:
      test: ["CMD", "/easyp-svc", "health", "--cfg=/config.yml"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    volumes:
      - "./config/config.yml:/config.yml:ro"
      # Server key pair and the CA that signs the certificates it accepts —
      # those three and nothing else, because this container runs plugin
      # binaries and reads what it is given.
      - "./certs/server.crt:/certs/server.crt:ro"
      - "./certs/server.key:/certs/server.key:ro"
      - "./certs/ca.crt:/certs/ca.crt:ro"
      # rw: the service writes lazily downloaded plugin binaries here.
      - "../plugins:/plugins"
    # Every variable here overrides the matching field in config/config.yml. An
    # unset one arrives as an empty string and is treated as absent, so the file
    # keeps its value — that is what makes the `:-` form below safe.
    #
    # The OTel SDK variables that used to sit here (OTEL_EXPORTER_OTLP_ENDPOINT,
    # OTEL_SERVICE_NAME) were read by nothing: the endpoint belongs to the
    # telemetry section and so needs its prefix, and the service name is fixed in
    # the binary. Changing them looked like it did something and did not.
    environment:
      EASYP_CONFIG: /config.yml
      # The level is a setting now, not a command-line argument, so it can be
      # changed without editing this committed file: LOG_LEVEL=info docker compose up.
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      # Issued by the licence registry (easyp-tech/licenses); passed in from the
      # shell. LICENSE_PUBLIC_KEYS is "<kid>:<hex>,<kid>:<hex>".
      LICENSE_KEY: "${LICENSE_KEY:-}"
      LICENSE_PUBLIC_KEYS: "${LICENSE_PUBLIC_KEYS:-}"
      # Digests of the credentials allowed to call the mutating RPCs, as
      # "ci=<64 hex>,me=<64 hex>". config.yml ships a publicly known one so the
      # stack works out of the box; set this to replace it without editing a
      # committed file.
      AUTH_WRITE_TOKENS: "${AUTH_WRITE_TOKENS:-}"
      # config.yml points at the postgres container with a demo password. Set
      # this to point the stack at a database whose credentials are not in git.
      DB_POSTGRES_DSN: "${DB_POSTGRES_DSN:-}"
      TELEMETRY_OTLP_ENDPOINT: "${TELEMETRY_OTLP_ENDPOINT:-}"
      TELEMETRY_PYROSCOPE_ENDPOINT: "${TELEMETRY_PYROSCOPE_ENDPOINT:-}"
      # The stack's own object store is named in config.yml; these override it
      # for a deployment reading archives from somewhere else.
      REGISTRY_S3_ENDPOINT: "${REGISTRY_S3_ENDPOINT:-}"
      REGISTRY_S3_BUCKET: "${REGISTRY_S3_BUCKET:-}"
      REGISTRY_S3_ACCESS_KEY_ID: "${REGISTRY_S3_ACCESS_KEY_ID:-}"
      REGISTRY_S3_SECRET_ACCESS_KEY: "${REGISTRY_S3_SECRET_ACCESS_KEY:-}"
    # The gRPC port is deliberately not published: it is reachable only from
    # inside easyp_network, and from outside only through traefik, which is the
    # single party holding a client certificate. The remaining ports serve
    # plaintext diagnostics and stay local.
    ports:
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_METRICS_PORT:-8081}:8081"
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_HEALTH_PORT:-8082}:8082"
      - "${EASYP_BIND:-127.0.0.1}:${EASYP_MCP_PORT:-8083}:8083"
    labels:
      service: easyp-api-service
      traefik.enable: "true"
      traefik.http.routers.easyp-api.rule: "Host(`easyp.api.localhost`)"
      traefik.http.routers.easyp-api.entrypoints: "websecure"
      traefik.http.routers.easyp-api.tls: "true"
      traefik.http.routers.easyp-api.service: "easyp-api"
      traefik.http.services.easyp-api.loadbalancer.server.port: "8080"
      # https + this transport is what makes the backend leg mutual TLS.
      traefik.http.services.easyp-api.loadbalancer.server.scheme: "https"
      traefik.http.services.easyp-api.loadbalancer.serversTransport: "easyp-mtls@file"
    networks:
      - easyp_network
