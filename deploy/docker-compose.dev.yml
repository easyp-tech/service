# Distinct from the main stack's `easyp`, so the two can be up at once and
# `down` on one does not take the other's volumes with it. Pinned rather than
# inferred: compose otherwise names the project after the directory holding this
# file, which changes the volume names the moment anyone moves or renames it.
name: easyp-svc

networks:
  easyp_network:
    name: easyp_network
    driver: bridge
    # Pinned because server.trusted_proxies in both tier configs names this range.
    # A subnet from Docker's pool would change when the network was recreated and
    # the service would quietly stop believing traefik's forwarding headers,
    # collapsing every caller into one rate-limit bucket.
    #
    # ip_range keeps the static addresses below out of the dynamic pool. Without
    # it Docker hands 172.28.0.10 to whoever starts while traefik is down — on
    # the dev host grafana held traefik's address for a week, and the next
    # deploy could not start the proxy at all ("Address already in use", with
    # nothing listening on 80 or 443 to explain it). Statics live in
    # 172.28.0.0/24, everything dynamic comes from the range.
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.1.0/24

volumes:
  postgres-data:

services:

  traefik:
    image: traefik:v3.6
    container_name: easyp-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    volumes:
      - "./observability/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./observability/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
      # Named file by file rather than mounting deploy/certs wholesale, which is
      # what used to happen and which handed every container the CA's private
      # key along with everything else. ca.key belongs in no container at all:
      # only gen-dev-certs.sh signs with it, and that runs on the host.
      #
      # These five are what dynamic.yml refers to: the CA to verify the service
      # against, traefik's own identity on the mTLS leg inward, and the edge
      # certificate it serves outward.
      - "./certs/ca.crt:/certs/ca.crt:ro"
      - "./certs/client.crt:/certs/client.crt:ro"
      - "./certs/client.key:/certs/client.key:ro"
      - "./certs/edge.crt:/certs/edge.crt:ro"
      - "./certs/edge.key:/certs/edge.key:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # The only service published on all interfaces, because it is the entry
    # point: it terminates the edge certificate and is the single party holding
    # a client certificate for the mTLS leg inward. Everything else below binds
    # to loopback — see EASYP_BIND.
    ports:
      - "80:80"
      - "443:443"
    networks:
      easyp_network:
        # Fixed so that server.trusted_proxies can name traefik rather than the
        # whole subnet. Trusting 172.28.0.0/16 meant trusting every container on
        # it: any one of them could set X-Forwarded-For and with it choose whose
        # rate-limit bucket to spend and whose name to write into the audit log.
        # The subnet is already pinned above, so an address inside it is stable.
        ipv4_address: 172.28.0.10

  postgres:
    image: postgres:17.7
    container_name: easyp-postgres
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: easyp_community_db
      POSTGRES_USER: easyp_svc
      POSTGRES_PASSWORD: easyp_pass
    # Loopback by default. This password is committed, in a public repository,
    # so a stack brought up on a machine with a public address hands the database
    # to anyone who reads the file. That is not hypothetical: the dev host had
    # 5432 open to the internet, and its logs show it being scanned.
    ports:
      - "${EASYP_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyp_svc -d easyp_community_db"]
      interval: 2s
      timeout: 3s
      retries: 10
      # Ten tries at two seconds is twenty seconds, which is not a first boot.
      # An empty volume means initdb, and the entrypoint then stops the server it
      # used for that and starts the real one — so health legitimately flaps for
      # a while, the retries run out, and every dependent gives up with
      # "dependency failed to start". Measured at just over a minute on the two
      # core dev host. start_period makes those failures not count.
      start_period: 120s
    networks:
      - easyp_network

  init-db:
    image: postgres:17.7
    container_name: easyp-init-db
    depends_on:
      postgres:
        condition: service_healthy
    # `|| true; exit 0` here used to mean "tolerate an existing database". It
    # also meant "tolerate a database that was never created": when this ran
    # against a postgres still rejecting connections, CREATE DATABASE failed,
    # the step reported success, and compose started the enterprise service
    # against a database that did not exist. It then crash-looped on 3D000 while
    # the stack looked like it had come up.
    #
    # So: wait for connections to actually be served, then create — and if that
    # fails, prove the database is there before claiming success. Anything else
    # is a real failure and should stop the dependents.
    entrypoint: >
      /bin/sh -c "
      until PGPASSWORD=easyp_pass psql -h postgres -U easyp_svc -d easyp_community_db -c 'SELECT 1' >/dev/null 2>&1; do
      echo waiting for postgres to accept connections; sleep 1;
      done;
      PGPASSWORD=easyp_pass createdb -h postgres -U easyp_svc easyp_enterprise_db ||
      PGPASSWORD=easyp_pass psql -h postgres -U easyp_svc -d easyp_enterprise_db -c 'SELECT 1' >/dev/null
      "
    networks:
      - easyp_network

  service-community:
    # Pinned, not floating. `:latest` is published only when a release tag is
    # pushed, so it means "the last release" rather than "the current master" —
    # and `docker compose up` without an explicit pull will keep an old layer
    # indefinitely. That combination produced a dead end: the sparse config files
    # in this repository were rejected by a `:latest` image built before the
    # loader learned to supply defaults, with an error naming a key whose default
    # is documented. Set EASYP_SERVICE_VERSION to a release tag, to `edge` for
    # the tip of master, or to `sha-<short>` to pin the exact commit under test.
    image: ghcr.io/easyp-tech/service:${EASYP_SERVICE_VERSION:-v1.0.0}
    container_name: easyp-api-community
    restart: always
    user: "${EASYP_UID:-65532}:${EASYP_GID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    command: ["service", "start", "--cfg=/config.community.dev.yml"]
    volumes:
      - "./config/config.community.dev.yml:/config.community.dev.yml:ro"
      # The three files server.tls in the config names, and no more. This
      # container executes plugin binaries; anything mounted here is readable by
      # them, which is why the CA's private key is not among these.
      - "./certs/server.crt:/certs/server.crt:ro"
      - "./certs/server.key:/certs/server.key:ro"
      - "./certs/ca.crt:/certs/ca.crt:ro"
      - "./plugins-community:/plugins"
    environment:
      # The level is a setting now, not a command-line argument, so it can be
      # changed without editing this committed file: LOG_LEVEL=info docker compose up.
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      # No LICENSE_* here, deliberately: this container is the control in the
      # experiment, and a licence reaching it would make the stack unable to tell
      # the two tiers apart.
      #
      # Everything below overrides the matching field in the tier config. An
      # unset variable arrives empty and is treated as absent, so the file keeps
      # its value.
      REGISTRY_S3_ACCESS_KEY_ID: "${REGISTRY_S3_ACCESS_KEY_ID:-}"
      REGISTRY_S3_SECRET_ACCESS_KEY: "${REGISTRY_S3_SECRET_ACCESS_KEY:-}"
      # The tier configs ship no write tokens: this stack is the one
      # docker-compose.public.yml puts on the internet, so writes are denied
      # until a credential arrives here. "ci=<64 hex>,me=<64 hex>".
      AUTH_WRITE_TOKENS: "${AUTH_WRITE_TOKENS:-}"
      DB_POSTGRES_DSN: "${DB_POSTGRES_DSN:-}"
      # Empty in the tier configs, because this stack has no collector unless
      # docker-compose.observability.yml is layered on top. Set both when it is.
      TELEMETRY_OTLP_ENDPOINT: "${TELEMETRY_OTLP_ENDPOINT:-}"
      TELEMETRY_PYROSCOPE_ENDPOINT: "${TELEMETRY_PYROSCOPE_ENDPOINT:-}"
      # Tags traces and profiles, the two signals that otherwise arrive from
      # both tiers under one name and cannot be told apart afterwards. Metrics
      # already carry the same word as a label, put there by Alloy from the
      # service label below — keep the two spellings equal.
      TELEMETRY_SERVICE_TIER: community
    ports:
      - "${EASYP_BIND:-127.0.0.1}:8080:8080"
      - "${EASYP_BIND:-127.0.0.1}:8081:8081"
      - "${EASYP_BIND:-127.0.0.1}:8082:8082"
      - "${EASYP_BIND:-127.0.0.1}:8083:8083"
    labels:
      service: easyp-api-community
      traefik.enable: "true"
      # Two names for one tier: the .localhost one for a stack running on a
      # laptop, the public one for wherever dev is deployed. The bare domain
      # answers here too — an unqualified client is an anonymous one, and
      # community is what anonymous callers are entitled to.
      traefik.http.routers.easyp-community.rule: >-
        Host(`community.easyp.localhost`)
        || Host(`community.${EASYP_DEV_DOMAIN:-plugins.beta.easyp.tech}`)
        || Host(`${EASYP_DEV_DOMAIN:-plugins.beta.easyp.tech}`)
      traefik.http.routers.easyp-community.entrypoints: "websecure"
      traefik.http.routers.easyp-community.tls: "true"
      traefik.http.routers.easyp-community.service: "easyp-community"
      traefik.http.services.easyp-community.loadbalancer.server.port: "8080"
      traefik.http.services.easyp-community.loadbalancer.server.scheme: "https"
      traefik.http.services.easyp-community.loadbalancer.serversTransport: "easyp-mtls@file"
    networks:
      - easyp_network

  service-enterprise:
    # Pinned, not floating. `:latest` is published only when a release tag is
    # pushed, so it means "the last release" rather than "the current master" —
    # and `docker compose up` without an explicit pull will keep an old layer
    # indefinitely. That combination produced a dead end: the sparse config files
    # in this repository were rejected by a `:latest` image built before the
    # loader learned to supply defaults, with an error naming a key whose default
    # is documented. Set EASYP_SERVICE_VERSION to a release tag, to `edge` for
    # the tip of master, or to `sha-<short>` to pin the exact commit under test.
    image: ghcr.io/easyp-tech/service:${EASYP_SERVICE_VERSION:-v1.0.0}
    container_name: easyp-api-enterprise
    restart: always
    user: "${EASYP_UID:-65532}:${EASYP_GID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    command: ["service", "start", "--cfg=/config.enterprise.dev.yml"]
    volumes:
      - "./config/config.enterprise.dev.yml:/config.enterprise.dev.yml:ro"
      # Same three as the community container above, and for the same reason.
      - "./certs/server.crt:/certs/server.crt:ro"
      - "./certs/server.key:/certs/server.key:ro"
      - "./certs/ca.crt:/certs/ca.crt:ro"
      - "./plugins-enterprise:/plugins"
    environment:
      # The level is a setting now, not a command-line argument, so it can be
      # changed without editing this committed file: LOG_LEVEL=info docker compose up.
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      # What makes this container the enterprise one. An unset or unverifiable
      # key is not a startup failure — the service logs it and runs as community,
      # so `task tier-dev` exists to assert the difference rather than assume it.
      LICENSE_KEY: "${LICENSE_KEY:-}"
      LICENSE_PUBLIC_KEYS: "${LICENSE_PUBLIC_KEYS:-}"
      REGISTRY_S3_ACCESS_KEY_ID: "${REGISTRY_S3_ACCESS_KEY_ID:-}"
      REGISTRY_S3_SECRET_ACCESS_KEY: "${REGISTRY_S3_SECRET_ACCESS_KEY:-}"
      # Same as the community container above: the config ships no write tokens,
      # so writes stay denied until a credential arrives here.
      AUTH_WRITE_TOKENS: "${AUTH_WRITE_TOKENS:-}"
      DB_POSTGRES_DSN: "${DB_POSTGRES_DSN:-}"
      TELEMETRY_OTLP_ENDPOINT: "${TELEMETRY_OTLP_ENDPOINT:-}"
      TELEMETRY_PYROSCOPE_ENDPOINT: "${TELEMETRY_PYROSCOPE_ENDPOINT:-}"
      # Declared, not derived from LICENSE_KEY above. A key that fails to verify
      # leaves this container running as community while still tagged
      # enterprise — which is the useful reading: it says what this container was
      # meant to be, and the licence metrics say what it actually is.
      TELEMETRY_SERVICE_TIER: enterprise
    ports:
      - "${EASYP_BIND:-127.0.0.1}:9080:8080"
      - "${EASYP_BIND:-127.0.0.1}:9081:8081"
      - "${EASYP_BIND:-127.0.0.1}:9082:8082"
      - "${EASYP_BIND:-127.0.0.1}:9083:8083"
    labels:
      service: easyp-api-enterprise
      traefik.enable: "true"
      traefik.http.routers.easyp-enterprise.rule: >-
        Host(`enterprise.easyp.localhost`)
        || Host(`enterprise.${EASYP_DEV_DOMAIN:-plugins.beta.easyp.tech}`)
      traefik.http.routers.easyp-enterprise.entrypoints: "websecure"
      traefik.http.routers.easyp-enterprise.tls: "true"
      traefik.http.routers.easyp-enterprise.service: "easyp-enterprise"
      traefik.http.services.easyp-enterprise.loadbalancer.server.port: "8080"
      traefik.http.services.easyp-enterprise.loadbalancer.server.scheme: "https"
      traefik.http.services.easyp-enterprise.loadbalancer.serversTransport: "easyp-mtls@file"
    networks:
      - easyp_network
