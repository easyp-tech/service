version: 2

project_name: easyp-svc

# The CLI is also a client tool: auth new-token, plugins build/publish, config
# validate all run on operator machines, not just in the container. The
# binaries here are for those machines; the Docker image compiles its own copy
# in the Dockerfile (buildx cross-compile, no QEMU) — both stamp the same
# {{ .Version }} into main.version, so the two builds cannot disagree about
# what they are.
builds:
  - main: ./cmd/easyp-svc
    binary: easyp-svc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Mirrors the Dockerfile's build line; if one changes, change both.
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # ELv2 requires the terms to travel with the software.
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SBOM per archive, attached to the release. Enterprise procurement asks
# for this, and generating it from the built artifact rather than from go.mod
# means it describes what actually shipped.
sboms:
  - artifacts: archive

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

changelog:
  sort: asc
  filters:
    exclude:
      - '(?i)^docs?:'
      - '(?i)^docs\([^:]+\):'
      - '(?i)^docs\[[^:]+\]:'
      - '^tests?:'
      - '(?i)^dev:'
      - '(?i)^chore:'
      - Merge pull request
      - Merge branch

release:
  skip_upload: false
  # A release can fail after publishing: the image scan runs against the pushed
  # image, so a finding reds the job that already uploaded. Without this, the
  # re-run dies on "asset already exists" and the assets have to be deleted by
  # hand before the pipeline can finish — which is how v0.13.0 was recovered.
  replace_existing_artifacts: true
  github:
    owner: easyp-tech
    name: service
  header: |
    `easyp-svc` is a free and open-source project built by volunteers.

dockers:
  - image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      # Same value as the label below, but the label is metadata on the image
      # and this one reaches the binary: it is what the service reports in its
      # logs and traces. Both are set here so they cannot drift apart.
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/easyp-tech/service"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - api
      - registry
      # The Dockerfile compiles from source, so every package cmd/easyp-svc
      # imports has to be in the build context. sdk is one of them.
      - sdk
      # Needed by the COPY in Dockerfile: ELv2 requires the terms to travel
      # with the software.
      - LICENSE

  - image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=VERSION={{ .Version }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/easyp-tech/service"
      - "--label=org.opencontainers.image.licenses=Elastic-2.0"
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - api
      - registry
      # The Dockerfile compiles from source, so every package cmd/easyp-svc
      # imports has to be in the build context. sdk is one of them.
      - sdk
      # Needed by the COPY in Dockerfile: ELv2 requires the terms to travel
      # with the software.
      - LICENSE

# Keyless: the identity in the signature is the workflow that produced the
# image, which is checkable without anyone holding a private key.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - --yes
      - "${artifact}@${digest}"
    artifacts: all
    output: true

docker_manifests:
  - name_template: "ghcr.io/easyp-tech/service:{{ .Tag }}"
    image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"

  - name_template: "ghcr.io/easyp-tech/service:latest"
    image_templates:
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-amd64"
      - "ghcr.io/easyp-tech/service:{{ .Tag }}-arm64"
