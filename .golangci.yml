version: "2"
run:
  tests: true
  # Without this the integration package is invisible to the linter, and code
  # nobody lints is code that drifts.
  build-tags:
    - integration
linters:
  default: all
  disable:
    # Old and new names of the same disabled linter, like wsl/wsl_v5 below:
    # `default: all` enables whichever spelling the installed version ships,
    # so both have to be named or an upgrade silently re-enables it.
    - exhaustruct
    - exhaustruct_v5
    - wsl
    - wsl_v5
    # Deprecated since golangci-lint v2.12.0 and replaced by gomodguard_v2,
    # which `default: all` already enables. Both being on meant every run
    # printed a deprecation warning above its findings, which is the kind of
    # noise that trains you to skim past the output.
    - gomodguard
  settings:
    gomoddirectives:
      # The three modules in this repository build against each other from the
      # working tree, not from the last tag: change a message in api/ and the
      # service compiles against it immediately, rather than after a release.
      # That is what the local replace directives are for, and they affect only
      # builds of this module — a consumer of api/ or sdk/ never sees them.
      replace-local: true
    lll:
      line-length: 140
    varnamelen:
      min-name-length: 2
      ignore-names:
        - ok
        - id
        - fn
        - ch
        - wg
        - rl
        - ip
        - st
        - eg
        - mu
        - db
    tagliatelle:
      case:
        use-field-name: false
        rules:
          json: snake
          yaml: snake
          xml: snake
          bson: snake
          avro: snake
          mapstructure: snake
    depguard:
      rules:
        main:
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 or crypto/rand instead
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
    rules:
      - linters:
          - ireturn
        text: returns generic interface
      - linters:
          - lll
        source: "^//go:generate "
      - linters:
          - revive
        text: "unexported-return: exported func .+ returns unexported type .+, which can be annoying to use"
      - linters:
          - gocritic
        path: cmd/[^/]+/.+\.go
        text: exitAfterDefer
      - linters:
          - revive
        text: "package name"
      - linters:
          - dupl
          - errcheck
          - funlen
          - gochecknoglobals
          - gocyclo
          - goconst
          - gosec
          - ireturn
          - lll
          - noinlineerr
          - unparam
          - varnamelen
          - testpackage
          - nilnil
          - dogsled
          - err113
        path: _test\.go
      - linters:
          - gochecknoglobals
        path: internal/core/domain\.go
      # cmd/main.go globals are cobra/flag package-level vars and ldflags injection points
      - linters:
          - gochecknoglobals
        path: cmd/main\.go
      # Sentinel key/logger globals are package-level design (not global state)
      - linters:
          - gochecknoglobals
        path: internal/(license/features|monitor/log)\.go
      - linters:
          - ireturn
        text: "Get returns interface"
      - linters:
          - revive
        text: "unused-parameter"
        path: _test\.go
      # context.Context in struct is intentional (pool, license interceptor carry cancellation)
      - linters:
          - containedctx
        path: internal/(core/pool|api/license_interceptor)\.go
      # pool.go creates a fresh context for worker lifetime (by design)
      - linters:
          - contextcheck
        path: internal/core/pool\.go
      # Transparent decorator pattern: tracing files pass through errors without adding context
      - linters:
          - wrapcheck
        path: internal/telemetry/tracing_
      # Worker pool calls interface methods; errors already carry context from lower layers
      - linters:
          - wrapcheck
        path: internal/core/pool\.go
      # NewWorkerPool wires metrics/logging/config; length is inherent
      - linters:
          - funlen
        path: internal/core/pool\.go
      # Graceful shutdown needs fresh context (not the canceled request context)
      - linters:
          - contextcheck
        text: "Non-inherited new context"
        path: cmd/main\.go
      # CreatePlugin/UpdatePlugin are symmetric by spec; duplication is intentional
      - linters:
          - dupl
        path: internal/api/api\.go
      # cyclop/gocognit/funlen/maintidx: run() wires all components; complexity is inherent
      - linters:
          - cyclop
          - gocognit
          - funlen
          - maintidx
        path: cmd/main\.go
      # ErrorToStatus maps all gRPC codes; complexity is inherent
      - linters:
          - cyclop
        path: internal/api/api\.go
      # applyFilter has one case per field; complexity is inherent
      - linters:
          - cyclop
        path: sdk/filter\.go
      # Generate builds SQL dynamically; complexity is inherent
      - linters:
          - cyclop
          - funlen
        path: internal/adapters/registry/registry\.go
      # claims_test uses table-driven approach; complexity is from test coverage
      - linters:
          - cyclop
        path: internal/license/claims_test\.go
      # telemetry.Init wires OTLP + Pyroscope; length is inherent
      - linters:
          - funlen
        path: internal/telemetry/telemetry\.go
      # Smoke test binary and test files: dynamic errors are acceptable
      - linters:
          - err113
        path: _test\.go
      - linters:
          - err113
          - wrapcheck
          - errcheck
          - forbidigo
          - noinlineerr
          - cyclop
          - gocognit
          - funlen
          - mnd
        path: cmd/mcp-smoke/
      # Configuration validation reports what is wrong with a specific setting:
      # the message carries the key, the value the operator wrote and what was
      # expected. A sentinel per setting would be a hundred exported errors
      # nobody matches on — callers print these, they do not branch on them.
      - linters:
          - err113
        path: internal/config/
      # Same for the SDK's option constructors and the limiter's defaults: the
      # literals in a defaults table ARE the documentation of the defaults, and
      # naming each one moves the value one hop away from where it is read.
      - linters:
          - mnd
        path: (sdk/config\.go|internal/ratelimiter/config\.go)
      # Validate and parseEnvTag are long lists of independent checks, not
      # nested logic: cyclomatic complexity counts each `if` the same, so the
      # number says "many settings" rather than "hard to follow". Splitting
      # further would scatter one subject across several functions.
      - linters:
          - cyclop
          - funlen
        path: internal/config/(config|fields)\.go
      # environmentLookuper returns envconfig's own interface because that is
      # what envconfig.ProcessWith takes; the concrete type is unexported and
      # deliberately so.
      - linters:
          - ireturn
        path: internal/config/config\.go
      # Option is an interface on purpose — it keeps the config struct
      # unexported, so a caller cannot build one field-by-field and skip the
      # invariants. Returning it is the pattern, not an accident.
      - linters:
          - ireturn
        path: sdk/config\.go
    # Vestigial boilerplate lived here: bin, config, debian, docs, scripts,
    # tests. None of those directories exist, but the entries are regexes
    # matched against the whole path, so `config` silently excluded
    # internal/config/** — the package with the heaviest churn and the one
    # whose bugs an operator hits on first install. It had never been linted.
    paths:
      - docs
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/easyp-tech/service)
      custom-order: true
  exclusions:
    generated: lax
    # Same story as above: only a real directory is named here.
    paths:
      - docs
