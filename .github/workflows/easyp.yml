name: EasyP

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # So release.yml can run the same contract checks against the tagged commit
  # before publishing anything — a release is where a proto mistake becomes
  # permanent.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: EasyP Lint
        uses: easyp-tech/actions/lint@v1.1.1
        with:
          version: v0.16.0
          config: easyp.yaml
          directory: api

  breaking:
    name: Breaking Changes
    # Not on tags: a release tag points at a commit master already carries, so
    # comparing it against master proves nothing — and the action's own fetch
    # fails on a tag checkout. The check that matters ran on the PR.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: EasyP Breaking
        uses: easyp-tech/actions/breaking@v1.1.1
        with:
          version: v0.16.0
          config: easyp.yaml
          directory: api
          against: master
