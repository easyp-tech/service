name: Go

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # Callable so that a release can depend on it. Publishing used to run none of
  # this: these jobs are bound to master, the release workflow to a tag, and
  # nothing connected the two — `git push --tags` shipped an image without a
  # test, a linter or a vulnerability scan having run against it. That it never
  # went wrong is down to the habit of waiting for a green master by hand.
  #
  # No job here reads pull-request context, which is what makes calling it from
  # a tag safe.
  workflow_call:

env:
  GOPROXY: https://proxy.golang.org,direct

permissions:
  contents: read

concurrency:
  # A superseded commit's checks are cost without information: cancel them and
  # run the newest. The ref keys the group, so different branches, tags and
  # PRs never cancel each other.
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so this never drifts from the module.
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      - name: Test
        run: go test -race ./...

  tidy:
    name: Tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      # A dependency left in the indirect block still builds and still passes
      # every other job here, so nothing else notices.
      - name: Tidy
        run: go mod tidy

      - name: No pending tidy changes
        run: git diff --exit-code go.mod go.sum

  integration:
    name: Integration
    runs-on: ubuntu-latest

    # A real database rather than a mock, because the defects these tests exist
    # to catch — a NOT NULL column, a pool whose workers were never started —
    # are invisible to anything that stands in for Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easyp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      # pg_dump and psql are what the restore drill actually exercises. The test
      # fails rather than skips when they are missing under CI: a skipped drill
      # reports success for a procedure that never ran.
      - name: postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test
        env:
          EASYP_TEST_DSN: postgres://postgres:postgres@localhost:5432/easyp?sslmode=disable
        # -p 1: one package at a time. go test runs packages concurrently by
        # default, and two of these — test/integration and goosemigrate — each
        # drop and recreate the public schema of the one database the job
        # provides. Run together, one's DROP SCHEMA lands under the other's
        # migration, and the failure reads as "relation goose_db_version does
        # not exist" in whichever test lost the race. It passed on the runs
        # where the timing happened to work and failed on the ones where it did
        # not, which is the definition of a flake and not a test.
        run: go test -p 1 -tags integration -timeout 10m ./test/... ./internal/database/...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      # The module pulls the AWS SDK, gRPC, goose and the Postgres driver. A
      # known CVE in any of them is not something anyone will notice by reading
      # go.sum, and this runs in seconds.
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Templates are code nothing else compiles. These checks cover the two
      # ways that has bitten: a value rendered in a form the service cannot
      # parse, and a values.yaml key with no env var behind it.
      - name: Lint and render
        run: deploy/charts/easyp-service/tests/render.sh

  # Rendering proves the templates produce YAML. It does not prove the YAML
  # produces a running pod, and the difference is where the chart's two worst
  # defects lived: a guard that made the documented cert-manager path
  # unreachable, and a values.yaml that named two mandatory inputs out of three.
  # Both rendered fine for months.
  #
  # This installs the shape a customer installs — cert-manager issuing both
  # certificates, an ingress in front, mutual TLS on the leg between them — and
  # waits for the pod to say it is ready.
  cluster:
    name: Chart on a cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: easyp

      # Built here and loaded into the cluster rather than pulled from the
      # registry. The chart's default image tag is its appVersion, which names
      # the release being prepared — an image that does not exist until this
      # very pipeline publishes it, and this job runs before that. Pulling any
      # already-published image does not work either: the chart and the binary
      # are released together, so an older image rejects the configuration the
      # current chart renders. Building it makes the job self-contained and, for
      # the first time, a test of the code in front of it.
      - name: Build the image under test
        run: |
          docker build -t easyp-service:ci .
          kind load docker-image easyp-service:ci --name easyp

      # The chart demands a CA issuer: both certificates have to chain to
      # something the other side trusts, and cert-manager writes that CA into
      # ca.crt of each secret, which is what tls.clientCASecret falls back to.
      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true --wait --timeout 5m
          kubectl apply -f - <<'EOF'
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: selfsigned
          spec:
            selfSigned: {}
          ---
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: easyp-ca
            namespace: cert-manager
          spec:
            isCA: true
            commonName: easyp-ca
            secretName: easyp-ca
            issuerRef:
              name: selfsigned
              kind: ClusterIssuer
          ---
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: easyp-ca
          spec:
            ca:
              secretName: easyp-ca
          EOF
          kubectl wait --for=condition=Ready certificate/easyp-ca -n cert-manager --timeout=2m

      # The ServersTransport the chart renders is a Traefik CRD. Only the
      # definition is needed for the object to apply; nothing has to route.
      - name: Install Traefik CRDs
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update
          helm install traefik traefik/traefik --namespace traefik --create-namespace --wait --timeout 5m

      - name: Postgres
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          helm install pg bitnami/postgresql \
            --set auth.postgresPassword=postgres --set auth.database=easyp \
            --wait --timeout 5m

      # The full path, and the values.yaml header's three mandatory inputs: the
      # DSN, TLS material (here cert-manager), and the ingress host with the
      # trusted proxies that must accompany it.
      - name: Install the chart
        run: |
          helm install easyp deploy/charts/easyp-service \
            --set secrets.create=true \
            --set secrets.data.DB_POSTGRES_DSN='postgres://postgres:postgres@pg-postgresql:5432/easyp?sslmode=disable' \
            --set certManager.enabled=true \
            --set certManager.issuerRef.name=easyp-ca \
            --set ingress.enabled=true \
            --set ingress.host=easyp.example.com \
            --set 'config.server.trustedProxies={10.244.0.0/16}' \
            --set image.repository=easyp-service \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --wait --timeout 8m

      # An install that times out reports only "Available: 0/1", which says that
      # the pod did not become ready and nothing about why. Everything that would
      # answer that — the image it could not pull, the probe it failed, the line
      # it died on — lives in the cluster and is gone when the job ends.
      - name: Why the pod is not ready
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/easyp-easyp-service | tail -40
          kubectl describe pod -l app.kubernetes.io/name=easyp-service | tail -60
          kubectl logs -l app.kubernetes.io/name=easyp-service --all-containers --tail=100 || true
          kubectl get events --sort-by=.lastTimestamp | tail -30

      - name: The pod is ready and answering
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=easyp-service --timeout=5m
          pod="$(kubectl get pod -l app.kubernetes.io/name=easyp-service -o name | head -1)"
          kubectl exec "$pod" -- /easyp-svc --version

      # Chart 0.3.1 fixed exactly this and nothing tested it: the secret was not
      # hashed into the pod template, so rotating a write token left the old pod
      # running and the new token rejected until someone restarted by hand.
      - name: Rotating a write token rolls the pod
        run: |
          before="$(kubectl get pod -l app.kubernetes.io/name=easyp-service -o jsonpath='{.items[0].metadata.name}')"
          helm upgrade easyp deploy/charts/easyp-service --reuse-values \
            --set secrets.data.AUTH_WRITE_TOKENS="ci=$(printf 'rotated' | sha256sum | cut -d' ' -f1)" \
            --wait --timeout 5m
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=easyp-service --timeout=5m
          after="$(kubectl get pod -l app.kubernetes.io/name=easyp-service -o jsonpath='{.items[0].metadata.name}')"
          if [[ "$before" == "$after" ]]; then
            echo "::error::the pod was not replaced; the secret is not hashed into the pod template"
            exit 1
          fi

      - name: Describe what failed
        if: failure()
        run: |
          kubectl get pods,certificates,secrets -A
          kubectl describe pod -l app.kubernetes.io/name=easyp-service || true
          kubectl logs -l app.kubernetes.io/name=easyp-service --tail=200 || true

  # Generated code is checked in, and nothing checked that it matched the proto
  # it claims to come from. Two ways that went wrong: `easyp generate` leaves
  # .mcp.go untouched without an error, so it can be arbitrarily stale; and the
  # files in the tree had been produced by a locally patched toolchain that
  # exists nowhere in this repository, which the version stamp in their headers
  # records. Regenerating and diffing catches both — the stamp is part of the
  # diff.
  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      # The version go.mod declares, which is what makes this a check rather
      # than a race between whatever each machine happens to have installed.
      - name: Install easyp
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/easyp-tech/easyp 2>/dev/null || echo v0.16.6)"
          go install "github.com/easyp-tech/easyp/cmd/easyp@${version}"

      # Both steps. easyp writes .pb.go and _grpc.pb.go; .mcp.go needs the
      # direct plugin invocation, per the KNOWN ISSUE in easyp.yaml.
      - name: Regenerate
        run: |
          easyp --cfg easyp.yaml generate
          go run -tags mcpgen ./test/mcpgen

      - name: No pending regeneration
        run: |
          if ! git diff --exit-code; then
            echo "::error::generated code does not match the proto; run the two commands above and commit"
            exit 1
          fi

  # Two credentials have already reached this public repository through files
  # nobody thought to gitignore. A pattern list catches the shapes; this catches
  # the rest, and it reads history rather than only the tip.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The CLI, not gitleaks-action: the action requires a paid licence on
      # organisation repositories, and refusing to run is worse than the scan
      # taking a few seconds longer. --redact so a finding does not print the
      # credential into a public build log.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      - name: Scan for secrets
        run: |
          # The module still declares the pre-rename path, so `go run` has to
          # ask for it under that name.
          go run github.com/zricethezav/gitleaks/v8@latest detect \
            --source . --redact --no-banner --exit-code 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            api/go.sum
            sdk/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint refuses to start when it is built with an older Go
          # than the one go.mod targets, so this has to keep up with go.mod.
          version: latest
