name: "Release"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # The same checks master gets, run against the tagged commit before anything
  # is published. A tag usually points at a commit master has already tested,
  # but "usually" was the whole guarantee: nothing stopped a tag on an untested
  # commit, or on a branch, from publishing an image.
  verify:
    uses: ./.github/workflows/go.yml

  # The API contract gets the same treatment as the code: proto lint and the
  # breaking-change check gate the release, not just master pushes. A release
  # is exactly the moment a contract mistake becomes permanent.
  verify-proto:
    uses: ./.github/workflows/easyp.yml

  release:
    needs: [verify, verify-proto]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Keyless signing: cosign exchanges this token for a short-lived
      # certificate, so nothing long-lived has to be stored as a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod: the pinned 1.24 had drifted from the
          # module's 1.26 and only worked via toolchain auto-download.
          go-version-file: go.mod

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag ${GITHUB_REF_NAME} is not a valid release version"
            exit 1
          fi
          echo "✅ Valid release tag: ${GITHUB_REF_NAME}"

      # The chart's appVersion is the default image tag, so it has to name the
      # release being cut: ahead, and a default install pulls a tag that does
      # not exist; behind, and it installs last month's service. Checked before
      # anything is published, while the mismatch is still free to fix.
      - name: Chart appVersion matches the tag
        run: |
          app_version="$(grep -E '^appVersion:' deploy/charts/easyp-service/Chart.yaml | awk '{print $2}' | tr -d '"')"
          if [[ "${app_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "❌ Chart.yaml appVersion is ${app_version}, the tag is ${GITHUB_REF_NAME}; align them before releasing"
            exit 1
          fi
          echo "✅ Chart appVersion matches: ${app_version}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # goreleaser shells out to syft for the SBOMs; without it on PATH the
      # release fails at the cataloguing step, after the binaries are built.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Create release
        uses: goreleaser/goreleaser-action@v7
        with:
          # A major-series pin, not `latest`: an unpinned tool is how the lint
          # job broke, and a release pipeline is the worst place to find that
          # out. Bump the series deliberately.
          version: '~> v2'
          args: release --clean --timeout=90m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After publication rather than before: goreleaser builds and pushes in one
      # step, so there is no local image to scan first. A finding here means
      # pulling the tag, not that customers were spared it — treat a failure as
      # a reason to cut a patch release, not as noise.
      - name: Scan the published image
        # The tags on this action carry a leading v. Referencing 0.28.0 without
        # it does not fail the step — it fails the whole job at set-up, before
        # anything is built, which is how v0.9.0 came to publish nothing at all.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/easyp-tech/service:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # The chart rides the same tag as the image it installs: appVersion equality
  # is enforced above, so a chart in the OCI registry always names an image
  # that exists. Runs after the image is published — a chart pointing at a tag
  # still mid-publish would fail its first install.
  chart:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      # Charts are immutable by convention and mutable in fact: an OCI tag can be
      # overwritten. appVersion equality is enforced above, and nothing enforced
      # that the chart's own version had moved — so a release that forgot to
      # bump it would replace, in place, the chart customers already had. The
      # comment in Chart.yaml names this hazard; this is what catches it.
      - name: The chart version is not already published
        run: |
          chart_version="$(grep -E '^version:' deploy/charts/easyp-service/Chart.yaml | awk '{print $2}' | tr -d '\"')"
          echo "chart version: ${chart_version}"
          if helm show chart "oci://ghcr.io/easyp-tech/charts/easyp-service" --version "${chart_version}" >/dev/null 2>&1; then
            echo "::error::chart ${chart_version} is already published; bump version: in Chart.yaml"
            exit 1
          fi
          echo "✅ ${chart_version} is unpublished"

      - name: Package and push the chart
        run: |
          helm package deploy/charts/easyp-service
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push easyp-service-*.tgz oci://ghcr.io/easyp-tech/charts
